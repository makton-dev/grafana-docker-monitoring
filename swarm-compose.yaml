networks:
  grafana:
    driver: overlay
    attachable: true
  loki:

volumes:
  grafana-storage:
    name: grafana
    driver: local
    driver_opts:
      type: none
      device: /mnt/gluster/grafana
      o: bind
  prometheus-storage:
    name: prometheus
    driver: local
    driver_opts:
      type: none
      device: /mnt/gluster/prometheus
      o: bind
  garage-storage:
    name: garage
    driver: local
    driver_opts:
      type: none
      device: /mnt/gluster/garage
      o: bind

services:
  loki-backend:
    image: grafana/loki:latest
    deploy:
      resources:
        limits:
          memory: "200M"
        reservations:
          memory: "150M"
      restart_policy:
        condition: any
    volumes:
      - ./server/loki-config.yaml:/etc/loki/config.yaml
    command: "-config.file=/etc/loki/config.yaml -config.expand-env=true -target=backend -legacy-read-mode=false"
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      - loki-proxy
    healthcheck:
      test: [  "CMD", "loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki


  loki-read:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -config.expand-env=true -target=read"
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    deploy:
      resources:
        limits:
          memory: "200M"
        reservations:
          memory: "150M"
      restart_policy:
        condition: any
    volumes:
      - ./server/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - garage
    healthcheck:
      test: [  "CMD", "loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki

  loki-write:
    image: grafana/loki:latest
    command: "-config.file=/etc/loki/config.yaml -config.expand-env=true -target=write"
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    deploy:
      resources:
        limits:
          memory: "500M"
        reservations:
          memory: "250M"
      restart_policy:
        condition: any
    volumes:
      - ./server/loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - garage
    networks:
      - loki

  loki-proxy:
    image: nginx:latest
    deploy:
      resources:
        limits:
          memory: "24M"
        reservations:
          memory: "16M"
      restart_policy:
        condition: any
    depends_on:
      - loki-read
      - loki-write
    volumes:
      - ./server/loki-nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loki
      - grafana

  garage:
    image: dxflrs/garage:v2.3.0
    deploy:
      resources:
        limits:
          memory: "1G"
        reservations:
          memory: "500M"
      restart_policy:
        condition: any
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: loki-data
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    volumes:
      - ./server/garage.toml:/etc/garage.toml:ro
      - garage-storage:/var/lib/garage
    healthcheck:
      test: [ "CMD", "/garage", "status" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - loki

  grafana:
    image: grafana/grafana:latest
    deploy:
      resources:
        limits:
          memory: "1G"
        reservations:
          memory: "500M"
      restart_policy:
        condition: any
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - TENANT_ID=${TENANT_ID}
    depends_on:
      - loki-proxy
      - prometheus
    volumes:
      - ./server/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grafana

  prometheus:
    image: prom/prometheus
    deploy:
      resources:
        limits:
          memory: "500M"
        reservations:
          memory: "250M"
      restart_policy:
        condition: any
    ports:
      - "9090:9090"
    volumes:
      - prometheus-storage:/prometheus
      - ./server/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    healthcheck:
      test: [ "CMD-SHELL", "/bin/wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grafana
