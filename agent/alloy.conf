// ###################################
// #### Node Metric Configuration ####
// ###################################

prometheus.exporter.unix "node" {
  set_collectors = ["cpu", "meminfo", "diskstats", "filesystem", "netdev"]
}

discovery.relabel "node" {
    targets = prometheus.exporter.unix.node.targets

    rule {
        target_label = "job"
        replacement  = "integrations/linux"
    }
    rule {
        target_label = "node"
        replacement  = sys.env("NODE_NAME")
    }
}

prometheus.scrape "node" {
  targets    = discovery.relabel.node.output
  forward_to = [ prometheus.remote_write.remote.receiver ]
  scrape_interval = "10s"
}

// #####################################
// #### Docker Metric Configuration ####
// #####################################

prometheus.exporter.cadvisor "docker" {
  docker_host      = "unix:///var/run/docker.sock"
  docker_only      = true
  enabled_metrics  = ["cpu", "memory", "disk", "network", "oom_event"]
}

discovery.relabel "docker" {
    targets = prometheus.exporter.cadvisor.docker.targets

    rule {
        target_label = "job"
        replacement  = "integrations/docker"
    }
    rule {
        target_label = "node"
        replacement  = sys.env("NODE_NAME")
    }
}

prometheus.scrape "docker" {
  targets    = discovery.relabel.docker.output
  forward_to = [ prometheus.remote_write.remote.receiver ]
  scrape_interval = "10s"
}

// ######################################
// #### Docker Logging Configuration ####
// ######################################

discovery.docker "logs" {
  host = "unix:///var/run/docker.sock"
}

discovery.relabel "logs_integrations_docker" {
  targets = []

  rule {
    source_labels = ["__meta_docker_container_name"]
    regex	  = "/(.*)"
    target_label  = "container_name"
  }
  rule {
    target_label = "node"
    replacement  = sys.env("NODE_NAME")
  }
}

loki.source.docker "default" {
  forward_to    = [loki.relabel.filter_logs.receiver]

  host		= "unix:///var/run/docker.sock"
  targets	= discovery.docker.logs.targets
  relabel_rules = discovery.relabel.logs_integrations_docker.rules
}

loki.relabel "filter_logs" {
  forward_to = [loki.write.remote.receiver]

  // Rule 1: Drop logs with "info" level.
  rule {
    action        = "drop"
//    source_labels = ["level"]
    regex         = "(?i).*info.*"
  }

  // Rule 2: Drop logs containing "healthcheck" in the message.
  rule {
    action        = "drop"
//    source_labels = ["message"]
    regex         = "(?i).*healthcheck.*"
  }
}

livedebugging {
  enabled = true
}

// ###########################
// #### Remoote Endpoints ####
// ###########################

prometheus.remote_write "remote" {
  endpoint {
    url = sys.env("PROM_ENDPOINT")
  }
}

loki.write "remote" {
  endpoint {
    url = sys.env("LOKI_ENDPOINT")
    tenant_id = sys.env("TENANT_ID")
  }
}
