networks:
  grafana:

volumes:
  grafana-storage:
    name: grafana
  prometheus-storage:
    name: prometheus
  loki-s3:
    name: loki

services:
  # Log Management and cleanup
  loki-backend:
    container_name: loki_backend
    image: grafana/loki
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256m
        reservations:
          cpus: '0.5'
          memory: 128m
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    ports:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    depends_on:
      - loki-proxy
    healthcheck:
      test: [  "CMD", "loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grafana

  # Log retrieval
  loki-read:
    container_name: loki_read
    image: grafana/loki
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256m
        reservations:
          cpus: '0.5'
          memory: 128m
    command: "-config.file=/etc/loki/config.yaml -target=read"
    ports:
      - 3101:3100
      - "7946"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [  "CMD", "loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      grafana:
        aliases:
          - loki

  # Log ingestion
  loki-write:
    container_name: loki_write
    image: grafana/loki
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.5'
          memory: 256m
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports:
      - 3102:3100
      - "7946"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      <<: *loki-dns

  # Nginx proxy for managing Loki read and write endpoints.
  loki-proxy:
    container_name: loki_proxy
    image: nginx
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 52m
        reservations:
          cpus: '0.25'
          memory: 24m
    depends_on:
      - loki-read
      - loki-write
    volumes:
      - ./loki-nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grafana

  # Might be moving this to garage (https://github.com/deuxfleurs-org/garage) as minio community support is ending .
  # have already tested garage and believe it would be a good replacement for this.
  minio:
    container_name: minio_s3
    image: minio/minio
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.5'
          memory: 256m
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - "9000"
    volumes:
      - loki-s3:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    networks:
      - grafana

  # Metric and Log Dashboard with Alerting ability
  grafana:
    container_name: grafana
    image: grafana/grafana
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048m
        reservations:
          cpus: '1.0'
          memory: 1024m
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - TENANT_ID=${TENANT_ID}
    depends_on:
      - loki-proxy
      - prometheus
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml
      - ./grafana.ini:/etc/grafana/grafana.ini
      - grafana-storage:/var/lib/grafana
#    ports:
#      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grafana

  # Telemetry Collector
  prometheus:
    container_name: prometheus
    image: prom/prometheus
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.5'
          memory: 256m
    ports:
      - "9090:9090"
    volumes:
      - prometheus-storage:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    healthcheck:
      test: [ "CMD-SHELL", "/bin/wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grafana

  # Nginx proxy for Grafana. May move to node service and use LetsEncrypt
  grafana-proxy:
    image: nginx:latest
    platform: linux/amd64
    container_name: grafana_proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 52m
        reservations:
          cpus: '0.25'
          memory: 24m
    networks:
    - grafana
    volumes:
      - ./nginx_certs:/opt/certificates
      - ./grafana-nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
      - 443:443

  # OTEL reciever for Proxmox Clusters
  alloy_proxmox:
    container_name: alloy_proxmox
    image: grafana/alloy
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.5'
          memory: 256m
    ports:
      - 4318:4318
    volumes:
      - ./alloy.proxmox:/etc/alloy/config.alloy:ro
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
