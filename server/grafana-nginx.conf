events { }
http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=5g
                     inactive=60m use_temp_path=off;
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        ssl_certificate /opt/certificates/server.crt;
        ssl_certificate_key /opt/certificates/server.key;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

            # Enable caching
            proxy_cache my_cache;  # Use the "my_cache" zone defined earlier
            proxy_cache_valid 200 302 10m;  # Cache 200/302 responses for 10 minutes
            proxy_cache_valid 404 1m;       # Cache 404 responses for 1 minute
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;  # Serve stale cache if backend is down
            proxy_cache_key "$scheme$request_method$host$request_uri";  # Unique key for cached items
        }
    }
}
